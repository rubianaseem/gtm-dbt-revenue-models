version: 2
models:
  - name: stg_hubspot__contacts
    description: Typed HubSpot contacts, soft-deleted rows removed. Emails lowercased and trimmed. notes_untrusted is free text and must be screened before reaching any model prompt.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
      - name: created_at
        data_tests:
          - not_null
          - not_in_future
  - name: stg_hubspot__companies
    columns:
      - name: company_id
        data_tests: [unique, not_null]
      - name: domain
        data_tests:
          - unique:
              config: {severity: warn}
  - name: stg_hubspot__campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
  - name: stg_hubspot__touches
    columns:
      - name: touch_id
        data_tests: [unique, not_null]
      - name: contact_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_hubspot__contacts'), field: contact_id}
              config: {severity: warn}
      - name: campaign_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_hubspot__campaigns'), field: campaign_id}
      - name: occurred_at
        data_tests: [not_null, not_in_future]
