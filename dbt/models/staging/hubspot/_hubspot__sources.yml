version: 2
sources:
  - name: hubspot
    description: Raw HubSpot export as a connector (Fivetran/Airbyte) would land it. All columns arrive as text.
    schema: raw_hubspot
    loaded_at_field: _fivetran_synced
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 36, period: hour}
    meta: {owner: marketing-ops, system: HubSpot}
    tables:
      - name: contacts
        columns:
          - name: id
            data_tests: [not_null]
      - name: companies
      - name: campaigns
        freshness:
          warn_after: {count: 72, period: hour}
          error_after: {count: 168, period: hour}
      - name: touches
