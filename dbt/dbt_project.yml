name: gtm_revenue
version: "1.0.0"
config-version: 2
profile: gtm_revenue

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Business "today" for every as-of calculation. Fixed so the demo and evals are reproducible.
  as_of_date: "2026-11-20"

models:
  gtm_revenue:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  gtm_revenue:
    +schema: seeds

data_tests:
  gtm_revenue:
    +store_failures: true
    +schema: test_failures
